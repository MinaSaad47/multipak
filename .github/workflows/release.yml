name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build x86_64 binary and AppImage
    # The oldest supported runner, so the binary works with older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev desktop-file-utils file

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="multipak"))')
          if [ "$tag" != "$crate" ]; then echo "tag $tag does not match crate version $crate"; exit 1; fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p multipak

      - name: Package tarball
        run: |
          name="multipak-${VERSION}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/multipak "dist/$name/"
          cp packaging/multipak.desktop packaging/multipak.svg README.md CHANGELOG.md LICENSE "dist/$name/"
          cp crates/multipak-gui/assets/multipak-256.png "dist/$name/multipak.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh target/release/multipak "$VERSION" dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Multipak ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS
