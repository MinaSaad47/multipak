# Built-in table of known Flatpak apps and how Multipak should launch them.
#
# Each entry:
#   id              Flatpak application ID (exact match)
#   kind            electron | chromium | firefox | generic
#   single_instance true if the app only allows one running copy (optional)
#   note            short remark shown in the UI (optional)
#
# Users can add or override entries in ~/.config/multipak/app_types.toml using
# the same format. See CONTRIBUTING.md before adding entries here.

