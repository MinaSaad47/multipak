[workspace]
resolver = "3"
members = ["crates/multipak-core", "crates/multipak-gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/MinaSaad47/multipak"
authors = ["Multipak contributors"]

[workspace.dependencies]
multipak-core = { path = "crates/multipak-core", version = "0.2.0" }

anyhow = "1.0.104"
ctrlc = "3.5.3"
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
egui = "=0.37.0"
egui_extras = { version = "=0.37.0", default-features = false, features = ["file", "image", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.5"
resvg = "0.45"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
walkdir = "2.5.1"
zbus = "5.19.0"
zstd = "0.14.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
